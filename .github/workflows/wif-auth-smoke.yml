name: WIF Auth Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  backend-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BACKEND_SERVICE_ACCOUNT }}
          project_id: tipificador-cloud-prod

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: tipificador-cloud-prod

      - name: Check active account
        run: gcloud config get-value account

      - name: Describe backend service
        run: |
          gcloud run services describe tipificador-api \
            --project tipificador-cloud-prod \
            --region us-central1

      - name: Validate GET /health
        run: |
          BACKEND_URL=$(gcloud run services describe tipificador-api \
            --project tipificador-cloud-prod \
            --region us-central1 \
            --format='value(status.url)')
          curl --fail --silent --show-error "${BACKEND_URL}/health"

  frontend-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_SERVICE_ACCOUNT }}
          project_id: tipificador-cloud

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: tipificador-cloud

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install firebase-tools
        run: npm install -g firebase-tools@15.23.0

      - name: Check active account
        run: gcloud config get-value account

      - name: List Firebase Hosting sites
        run: firebase hosting:sites:list --project tipificador-cloud
