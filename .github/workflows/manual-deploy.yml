name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Componente(s) a desplegar'
        required: true
        type: choice
        options:
          - both
          - backend
          - frontend
        default: 'both'
      vite_api_base:
        description: 'URL base del backend (solo para frontend-only)'
        required: false
        type: string

env:
  PROJECT_ID: tipificador-cloud-prod
  REGION: us-central1
  SERVICE: tipificador-api
  REPO: tipificador
  IMAGE_TAG: prod
  FIREBASE_PROJECT: tipificador-cloud

concurrency:
  group: tipificador-production-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    if: ${{ github.event.inputs.target == 'both' || github.event.inputs.target == 'backend' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.backend.outputs.url }}
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BACKEND_SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy backend
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REGION: ${{ env.REGION }}
          SERVICE: ${{ env.SERVICE }}
          REPO: ${{ env.REPO }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: bash tools/deploy_backend.sh

      - name: Get backend URL
        id: backend
        run: |
          BACKEND_URL="$(gcloud run services describe "${{ env.SERVICE }}" \
            --project "${{ env.PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --format='value(status.url)')"
          if [ -z "$BACKEND_URL" ]; then
            echo "No se pudo obtener la URL de Cloud Run para ${{ env.SERVICE }}."
            exit 1
          fi
          echo "url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          echo "Backend URL: $BACKEND_URL"

      - name: Health check
        run: |
          curl --fail --silent --show-error "${{ steps.backend.outputs.url }}/health" >/dev/null

  deploy-frontend:
    needs: deploy-backend
    if: ${{ always() && (github.event.inputs.target == 'both' || github.event.inputs.target == 'frontend') && (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      VITE_API_BASE: ${{ github.event.inputs.target == 'frontend' && github.event.inputs.vite_api_base || needs.deploy-backend.outputs.url }}
    steps:
      - name: Validate VITE_API_BASE for frontend-only
        if: ${{ github.event.inputs.target == 'frontend' }}
        run: |
          if [ -z "${{ github.event.inputs.vite_api_base }}" ]; then
            echo "VITE_API_BASE es obligatorio para un despliegue frontend-only."
            exit 1
          fi

      - uses: actions/checkout@v6

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_SERVICE_ACCOUNT }}
          project_id: ${{ env.FIREBASE_PROJECT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT }}

      - name: Install firebase-tools
        run: npm install -g firebase-tools@15.23.0

      - name: Deploy frontend
        env:
          FIREBASE_PROJECT: ${{ env.FIREBASE_PROJECT }}
        run: bash tools/deploy_frontend.sh
